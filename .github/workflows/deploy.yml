name: Build and Deploy
on:
  push:
    branches: [main] 
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        # Force install to ignore the 32-bit vs 64-bit plugin conflicts
        run: npm install --legacy-peer-deps

      - name: Build Project
        # CI=false prevents the build from stopping on small CSS warnings
        run: CI=false npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
